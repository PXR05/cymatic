name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows:
      - Auto Tag
    types:
      - completed

permissions:
  contents: write

jobs:
  resolve-tag:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_build: ${{ steps.resolve.outputs.should_build }}
      prev_tag: ${{ steps.prev.outputs.prev_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag and release state
        id: resolve
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            git fetch --tags --force
            TAG=$(git tag --sort=-creatordate | head -n 1)
          fi

          if [ -z "$TAG" ]; then
            echo "No tag found. Skipping build."
            echo "tag=" >> $GITHUB_OUTPUT
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${GITHUB_TOKEN}" "$API_URL")

          if [ "$STATUS" = "200" ]; then
            echo "Release already exists for ${TAG}. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Release not found for ${TAG}. Continuing build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve previous tag
        id: prev
        if: steps.resolve.outputs.should_build == 'true'
        run: |
          git fetch --tags --force
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ steps.resolve.outputs.tag }}^" 2>/dev/null || true)
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

  build:
    needs: resolve-tag
    if: needs.resolve-tag.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "build-tools;29.0.3"

      - name: Configure Android build-tools on PATH
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/build-tools/29.0.3" >> $GITHUB_PATH

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: |
          if [ -n "${{ needs.resolve-tag.outputs.prev_tag }}" ]; then
            git-cliff -c cliff.toml -o release-notes.md --tag "${{ needs.resolve-tag.outputs.tag }}" -- "${{ needs.resolve-tag.outputs.prev_tag }}..${{ needs.resolve-tag.outputs.tag }}"
          else
            git-cliff -c cliff.toml -o release-notes.md --tag "${{ needs.resolve-tag.outputs.tag }}"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assemble

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename signed APK
        run: |
          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          RENAMED_APK="cymatic-release-${{ needs.resolve-tag.outputs.tag }}.apk"
          mv "$SIGNED_APK" "$RENAMED_APK"
          echo "RENAMED_APK=$RENAMED_APK" >> $GITHUB_ENV

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: ${{ env.RENAMED_APK }}

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  release:
    needs: [resolve-tag, build]
    if: needs.resolve-tag.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: signed-apk

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/signed-apk/*.apk
          body_path: ${{ github.workspace }}/release-notes.md
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

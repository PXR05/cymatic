name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows:
      - Auto Tag
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            git fetch --tags --force
            TAG=$(git tag --sort=-creatordate | head -n 1)
          fi

          if [ -z "$TAG" ]; then
            echo "No tag found. Skipping build."
          else
            echo "TAG=$TAG" >> $GITHUB_ENV
          fi

      - name: Check if release exists
        if: env.TAG != ''
        run: |
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${GITHUB_TOKEN}" "$API_URL")

          if [ "$STATUS" = "200" ]; then
            echo "Release already exists for ${TAG}. Skipping build."
            echo "SHOULD_BUILD=false" >> $GITHUB_ENV
          else
            echo "Release not found for ${TAG}. Continuing build."
            echo "SHOULD_BUILD=true" >> $GITHUB_ENV
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout tag
        if: env.SHOULD_BUILD == 'true'
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "build-tools;29.0.3"

      - name: Configure Android build-tools on PATH
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/build-tools/29.0.3" >> $GITHUB_PATH

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        if: env.SHOULD_BUILD == 'true'
        run: git-cliff -c cliff.toml -o release-notes.md --tag ${{ env.TAG }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        if: env.SHOULD_BUILD == 'true'
        run: ./gradlew assemble

      - name: Sign APK
        if: env.SHOULD_BUILD == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        if: env.SHOULD_BUILD == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
          body_path: release-notes.md
          tag_name: ${{ env.TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
